<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeDecor — Ідеї для дому</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="logo">HomeDecor</div>
            <nav class="site-nav">
                <ul>
                    <li><a href="#">Каталог</a></li>
                    <li><a href="#">Ідеї</a></li>
                    <li><a href="#">Проекти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="ideas-section">
            <h2>Натхнення від Озарківа</h2>
            
            <div class="gallery">
                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image1.jpg" alt="Інтер'єр вітальні">
                    </div>
                    <figcaption>Сучасна та світла вітальня</figcaption>
                </figure>

                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image2.jpg" alt="Затишна спальня">
                    </div>
                    <figcaption>Затишна спальня в пастельних тонах</figcaption>
                </figure>

                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image3.jpg" alt="Скандинавська кухня">
                    </div>
                    <figcaption>Кухня в скандинавському стилі</figcaption>
                </figure>

                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image4.jpg" alt="Мінімалістичний офіс">
                    </div>
                    <figcaption>Робоче місце в стилі мінімалізму</figcaption>
                </figure>

                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image5.jpg" alt="Дитяча кімната">
                    </div>
                    <figcaption>Простора та функціональна дитяча</figcaption>
                </figure>

                <figure class="gallery-item">
                    <div class="image-wrapper">
                        <img src="images/image6.jpg" alt="Стильна ванна кімната">
                    </div>
                    <figcaption>Ванна кімната з елементами дерева</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p><strong>Адреса магазину:</strong> вул. Дизайнерська, 18, м. Київ</p>
            <p><a href="#">Політика повернення</a></p>
            <p>&copy; 2026 HomeDecor. Дизайн та розробка: Озарків Н.Р. Всі права захищені.</p>
        </div>
    </footer>
</body>
</html>
